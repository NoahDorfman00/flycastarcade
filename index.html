<canvas id="game"></canvas>
<script>
/* =====================================================================
   FLYCADE — Maniac's Road to the Flycast
   An unofficial fan-made parody arcade game. Not affiliated with OpTic.
   ===================================================================== */

const W = 960, H = 540;
const C = {
  g: '#93CA15', gDark: '#4d6b0b', gLite: '#d6ff7a',
  bg: '#0b0d0a', white: '#f4f6f0', gray: '#8a9184', red: '#ff4b3e', yellow: '#ffd23f',
};
const FH = '"Press Start 2P","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace';
const FB = '"VT323","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace';
const FE = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let SCALE = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  SCALE = s * dpr;
}
addEventListener('resize', resize);
resize();

/* ---------- utils ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);

function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function T(s, x, y, o = {}) {
  const size = o.size || 16;
  ctx.font = `${size}px ${o.font || FH}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(s, x + (o.sd || 3), y + (o.sd || 3)); }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 16; }
  ctx.fillStyle = o.color || C.white;
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
function E(e, x, y, size) {
  ctx.font = `${size}px ${FE}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(e, x, y);
}
function wrap(s, maxW, size, font = FB) {
  ctx.font = `${size}px ${font}`;
  const out = []; let cur = '';
  for (const w of s.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}
function para(s, x, y, maxW, size, lh, o = {}) {
  const lines = wrap(s, maxW, size, o.font || FB);
  lines.forEach((l, i) => T(l, x, y + i * lh, { size, font: FB, ...o }));
  return lines.length;
}

/* ---------- input ---------- */
const keys = {}, pressed = new Set();
const ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, justDown: false, swipe: 0 };
const GAME_KEYS = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'];
addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  unlockAudio();
  if (e.repeat) return;
  keys[e.code] = true; pressed.add(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
cv.addEventListener('pointerdown', e => {
  unlockAudio();
  cv.setPointerCapture(e.pointerId);
  [ptr.x, ptr.y] = toGame(e); ptr.sx = ptr.x; ptr.sy = ptr.y;
  ptr.down = true; ptr.justDown = true;
});
cv.addEventListener('pointermove', e => { [ptr.x, ptr.y] = toGame(e); });
const endPtr = e => {
  if (!ptr.down) return;
  [ptr.x, ptr.y] = toGame(e);
  ptr.down = false;
  const dx = ptr.x - ptr.sx, dy = ptr.y - ptr.sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) ptr.swipe = Math.sign(dx);
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

const act = () => pressed.has('Space') || pressed.has('Enter') || ptr.justDown;
const hit = (p, r) => p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];

/* ---------- audio ---------- */
let AC = null, muted = false;
function unlockAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (_) {}
}
function tone(f, d = 0.1, type = 'square', v = 0.06, slide = 0, delay = 0) {
  if (muted || !AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  tick: () => tone(rand(600, 760), 0.04, 'square', 0.035),
  good: () => { tone(880, 0.08); tone(1320, 0.12, 'square', 0.06, 0, 0.07); },
  bad: () => tone(180, 0.3, 'sawtooth', 0.07, -110),
  warn: () => { tone(300, 0.12, 'triangle', 0.08); tone(250, 0.18, 'triangle', 0.08, 0, 0.13); },
  select: () => tone(520, 0.06, 'square', 0.05),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.06, 0, i * 0.1)),
  fail: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'triangle', 0.09, 0, i * 0.14)),
  fanfare: () => [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) =>
    tone(f, 0.18, 'square', 0.06, 0, [0, .12, .24, .36, .6, .78, .9, 1.1][i])),
};
/* ---------- music: original 8-bit beat in a moody Toronto trap / R&B style ----------
   Half-time drums, sliding 808s, muffled minor-key chords and a sparse square lead.
   Composed for this game; not a cover of any real song. */
const BPM = 140, STEP = 60 / BPM / 4;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// C minor: Cm7 -> Abmaj7 -> Ebmaj7 -> Bb(add9)
const CHORDS = [
  { root: 36, tones: [60, 63, 67, 70] },
  { root: 32, tones: [56, 60, 63, 67] },
  { root: 39, tones: [58, 63, 67, 70] },
  { root: 34, tones: [58, 62, 65, 72] },
];
const KICK = [0, 7, 10], HATS_ROLL = [12, 13, 14, 15];
const LEAD = [ // [bar, step, midi, steps]
  [0, 0, 75, 3], [0, 3, 74, 3], [0, 6, 72, 4], [0, 12, 70, 4],
  [1, 0, 72, 3], [1, 3, 75, 3], [1, 6, 77, 2], [1, 8, 75, 8],
  [2, 0, 79, 3], [2, 3, 77, 3], [2, 6, 75, 4], [2, 10, 74, 6],
  [3, 0, 72, 3], [3, 3, 70, 3], [3, 6, 67, 4], [3, 12, 70, 4],
];
const MUS = { step: 0, next: 0, out: null, filt: null, noise: null };
function musInit() {
  if (MUS.out || !AC) return;
  MUS.out = AC.createGain(); MUS.out.gain.value = 0.55; MUS.out.connect(AC.destination);
  MUS.filt = AC.createBiquadFilter(); MUS.filt.type = 'lowpass'; MUS.filt.frequency.value = 1400; MUS.filt.Q.value = 3;
  MUS.filt.connect(MUS.out);
  const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  MUS.noise = buf;
}
function mOsc(type, f, t, dur, vol, dest, f2) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + Math.min(dur, 0.12));
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(dest || MUS.out);
  o.start(t); o.stop(t + dur + 0.05);
}
function mNoise(t, dur, vol, type, freq) {
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = MUS.noise; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(MUS.out);
  src.start(t); src.stop(t + dur + 0.02);
}
function musStep(n, t) {
  const bar = Math.floor(n / 16) % 4, st = n % 16, loop = Math.floor(n / 64);
  const ch = CHORDS[bar], full = G.scene === 'play' || G.scene === 'finale' || G.scene === 'clear';
  // muffled chord stab + arp (through the lowpass)
  if (st === 0) ch.tones.forEach(m => mOsc('triangle', mtof(m), t, STEP * 14, 0.035, MUS.filt));
  if (st % 2 === 0) mOsc('square', mtof(ch.tones[(st / 2) % 4] + 12), t, STEP * 1.6, 0.018, MUS.filt);
  // drums
  if (KICK.includes(st) || (bar === 3 && st === 14)) {
    mOsc('sine', 150, t, 0.22, 0.45, null, 42);
    mOsc('sine', mtof(ch.root + 12) * 2, t, STEP * 6, 0.32, null, mtof(ch.root + 12)); // sliding 808
  }
  if (st === 8) { mNoise(t, 0.16, 0.22, 'bandpass', 1600); mNoise(t + 0.012, 0.12, 0.12, 'bandpass', 2400); }
  const roll = bar === 3 && HATS_ROLL.includes(st);
  if (st % 2 === 0 || roll) mNoise(t, roll ? 0.03 : 0.045, roll ? 0.05 : 0.07, 'highpass', 7500);
  if (roll) mNoise(t + STEP / 2, 0.03, 0.04, 'highpass', 8000);
  // lead melody (gameplay + finale only, skips every 3rd loop for breathing room)
  if (full && loop % 3 !== 2) for (const [lb, ls, m, len] of LEAD) if (lb === bar && ls === st) mOsc('square', mtof(m), t, STEP * len, 0.03);
}
setInterval(() => {
  if (!AC) return;
  musInit();
  const now = AC.currentTime;
  if (muted || G.paused || AC.state !== 'running') { MUS.next = now + 0.05; return; }
  if (MUS.next < now) MUS.next = now + 0.05;
  while (MUS.next < now + 0.15) { musStep(MUS.step, MUS.next); MUS.next += STEP; MUS.step++; }
}, 25);

/* ---------- fx ---------- */
const pops = [], confetti = [];
let shakeAmt = 0, flashA = 0, flashC = '#f00';
function pop(s, x, y, c = C.g, size = 14) { pops.push({ s, x, y, c, size, t: 0 }); }
function shake(a) { shakeAmt = Math.max(shakeAmt, a); }
function flash(c, a = 0.35) { flashC = c; flashA = a; }
function burstConfetti(n) {
  for (let i = 0; i < n; i++) confetti.push({
    x: rand(0, W), y: rand(-200, -10), vx: rand(-40, 40), vy: rand(60, 200),
    r: rand(0, 6), vr: rand(-6, 6), c: pick([C.g, C.gLite, '#fff', '#111', C.yellow]), w: rand(5, 10), h: rand(8, 14),
  });
}

// Hitch: curly brown hair, thick black glasses, brown beard, olive hoodie.

    m: '#8a2f2f', h: '#4e5a2c', H: '#3d4722', k: '#e8e8e0', g: C.g, p: '#2b2b2e', o: '#f2f2f2', O: '#a9a9a9',
  },
};
function drawChar(spr, cx, fy, s, o = {}) {
  ctx.save();
  ctx.translate(cx, fy);
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale((o.flip ? -1 : 1) * (o.sx || 1), o.sy || 1);
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  const { map, pal } = spr;
  for (let j = 0; j < map.length; j++) {
    const row = map[j];
    for (let i = 0; i < row.length; i++) {
      const col = pal[row[i]];
      if (col) { ctx.fillStyle = col; ctx.fillRect((i - 8) * s, (j - 24) * s, s + 0.5, s + 0.5); }
    }
  }
  ctx.restore();
}
function headphones(cx, fy, s) {
  const top = fy - 24 * s;
  ctx.strokeStyle = '#111'; ctx.lineWidth = s * 1.1;
  ctx.beginPath(); ctx.arc(cx, top + 5 * s, 5.9 * s, Math.PI, Math.PI * 2); ctx.stroke();
  rrect(cx - 7 * s, top + 3.6 * s, 2.4 * s, 4 * s, s * 0.7, '#111', '#333', 1);
  rrect(cx + 4.6 * s, top + 3.6 * s, 2.4 * s, 4 * s, s * 0.7, '#111', '#333', 1);
}

const LOGO = { img: new Image(), light: null };
LOGO.img.onload = () => {
  const c = document.createElement('canvas');
  c.width = LOGO.img.width; c.height = LOGO.img.height;
  const x = c.getContext('2d');
  x.drawImage(LOGO.img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    if (d.data[i] + d.data[i + 1] + d.data[i + 2] < 200) d.data[i] = d.data[i + 1] = d.data[i + 2] = 244;
  }
  x.putImageData(d, 0, 0);
  LOGO.light = c;
};
LOGO.img.src = OPTIC_PNG;
// emblem only by default; o.word adds the "OPTIC GAMING" wordmark. o.dark keeps the black parts black.
function drawLogo(x, y, h, o = {}) {
  if (!LOGO.light) return;
  const sw = o.word ? 579 : 228, w = sw * h / 149;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  ctx.drawImage(o.dark ? LOGO.img : LOGO.light, 0, 0, sw, 149, x - w / 2, y - h / 2, w, h);
  ctx.globalAlpha = 1;
}
const HEART = ['.xx.xx.', 'xxxxxxx', 'xxxxxxx', '.xxxxx.', '..xxx..', '...x...'];
function heart(x, y, s, c) {
  HEART.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'x') rect(x + i * s, y + j * s, s, s, c); }));
}
function drawFly(x, y, t, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const flap = Math.sin(t * 60) * 0.5 + 0.5;
  ctx.fillStyle = 'rgba(220,255,200,.75)';
  ctx.beginPath(); ctx.ellipse(-6, -8, 7, 4 + flap * 3, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -8, 7, 4 + flap * 3, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(0, 0, 7, 9, 0, 0, Math.PI * 2); ctx.fill();
  circle(-3, -7, 3, '#b3001b'); circle(3, -7, 3, '#b3001b');
  ctx.restore();
}

/* ---------- BTH (Believe The Hype) logo: red B + H split by a sword "T" ---------- */
function drawBTH(cx, cy, h, alpha = 1) {
  const u = h / 110;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(u, u);
  ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round';
  const guard = [[-34, -30], [34, -30], [46, -6], [14, -18], [-14, -18], [-46, -6]];
  const blade = [[-9, -18], [9, -18], [9, 38], [0, 54], [-9, 38]];
  const grip = [[-6, -48], [0, -56], [6, -48], [6, -30], [-6, -30]];
  const poly = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
  const shapes = [blade, guard, grip];

  [['#0b0b0b', 16], ['#ffffff', 8]].forEach(([c, lw]) => {
    ctx.strokeStyle = c; ctx.lineWidth = lw;
    shapes.forEach(sh => { poly(sh); ctx.stroke(); });
    letters.forEach(([l, x, y]) => ctx.strokeText(l, x, y));
  });
  // fills
  poly(blade); ctx.fillStyle = '#c9ced4'; ctx.fill();

  ctx.restore();
}

      rect(0, 0, W, H, 'rgba(40,0,0,.72)');
      const s = ease(Math.min(1, G.t * 2.5));
      T('L', W / 2, 210, { size: 40 + 80 * s, align: 'center', color: C.red, shadow: '#000', sd: 6 });
      T('TAKE THE L', W / 2, 262, { size: 22, align: 'center' });
      para(G.game.fail, W / 2, 312, 700, 30, 30, { align: 'center', color: '#ffd8d4' });
      T(`L's taken this run: ${G.fails}`, W / 2, 400, { size: 24, font: FB, align: 'center', color: '#c99' });
      if (G.t > 0.8 && (G.t * 2 % 1) < 0.65) T('SPACE / TAP TO RETRY', W / 2, 450, { size: 14, align: 'center', color: C.white });
    },
  },
  finale: {
    update(dt) {
      const f = G.fin;
      if (f.phase === 'walk') {
        f.x += 170 * dt;
        if (f.x >= 360) { f.x = 360; f.phase = 'talk'; sfx.select(); }
      } else if (f.phase === 'talk') {
        if (act()) {
          f.i++; sfx.select();
          if (f.i >= FIN_LINES.length) { f.phase = 'live'; f.lt = 0; sfx.fanfare(); burstConfetti(180); }
        }
      } else {
        f.lt += dt;
        if (f.lt > 0.4 && f.lt % 2 < dt) burstConfetti(40);
        for (const [, , at] of LIVE_LINES) if (f.lt >= at && f.lt - dt < at) sfx.select();
        if (f.lt > LIVE_DONE + 0.8 && act()) { sfx.select(); go('title'); }
      }
    },
    draw() {
      const f = G.fin, t = G.t, live = f.phase === 'live';
      // bookshelf wall (like the real set)
      rect(0, 0, W, 312, '#1a140f');
      for (const b of BOOKS) rect(b.x, b.y, b.w, b.h, b.c);
      for (let j = 0; j < 3; j++) rect(0, 94 + j * 100, W, 8, '#3b2a1b');
      rect(0, 0, W, 312, 'rgba(0,0,0,.42)');
      // giant thumbnail letters
      T('FLYCAST', W / 2, 150, { size: 96, font: '"Archivo Black", Impact, sans-serif', align: 'center', color: '#fff', shadow: 'rgba(0,0,0,.6)', sd: 7 });
      drawFly(770, 60 + Math.sin(t * 4) * 6, t, 0.9);
      rrect(425, 176, 110, 66, 8, 'rgba(0,0,0,.65)');
      drawLogo(480, 209, 48);
      // on air
      rrect(806, 18, 130, 40, 6, live ? '#ff2d2d' : '#3a1414', '#000', 2);
      if (live) { ctx.shadowColor = '#ff2d2d'; ctx.shadowBlur = 24; }
      T('ON AIR', 871, 46, { size: 14, align: 'center', color: live ? '#fff' : '#6a3a3a' });
      ctx.shadowBlur = 0;
      // led strip + floor
      rect(0, 308, W, 4, C.g);
      ctx.shadowColor = C.g; ctx.shadowBlur = 18; rect(0, 309, W, 2, C.gLite); ctx.shadowBlur = 0;
      const fg = ctx.createLinearGradient(0, 312, 0, H);
      fg.addColorStop(0, '#16190f'); fg.addColorStop(1, '#070806');
      rect(0, 312, W, 228, fg);
      // hosts
      const walking = f.phase === 'walk';
      const bob = walking ? Math.abs(Math.sin(t * 12)) * 5 : 0;
      drawChar(MANIAC, f.x, 470 - bob, 7);
      if (live) headphones(f.x, 470, 7);
      drawChar(HITCH, 600, 470, 7, { flip: true });
      headphones(600, 470, 7);
      // desk + SM7B-style mics
      rrect(150, 394, 660, 146, 10, '#1d1f1c');
      rect(158, 394, 644, 5, '#2f332d'); rect(158, 400, 644, 3, C.g);
      [[410, 1], [550, -1]].forEach(([mx, d]) => {
        ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(mx + 30 * d, 394); ctx.lineTo(mx + 14 * d, 392); ctx.lineTo(mx, 386); ctx.stroke();
        rrect(mx - 13, 344, 26, 52, 11, '#141414', '#303030', 2);
        for (let k = 0; k < 5; k++) rect(mx - 9, 350 + k * 6, 18, 2, '#2a2a2a');
      });
      // dialog / outro
      if (f.phase === 'talk') {
        const [who, line] = FIN_LINES[f.i];
        rrect(60, 418, 840, 108, 10, 'rgba(0,0,0,.88)', C.g, 3);
        rrect(80, 404, who.length * 14 + 28, 28, 6, who === 'HITCH' ? C.g : '#f4f6f0');
        T(who, 94, 424, { size: 12, color: '#000' });
        para(line, 86, 462, 790, 30, 30);
        if ((t * 2 % 1) < 0.6) T('▼', 870, 510, { size: 14, color: C.g });
        const sx = who === 'HITCH' ? 600 : f.x;
        T('!', sx, 284 - Math.abs(Math.sin(t * 8)) * 4, { size: 16, align: 'center', color: C.yellow });
      }
      if (live) {
        for (const [who, line, at] of LIVE_LINES) {
          if (f.lt < at) continue;
          const shown = line.slice(0, Math.floor((f.lt - at) * 28));
          const hx = who === 'HITCH' ? 600 : f.x, bx = who === 'HITCH' ? 560 : 100;
          rrect(bx, 214, 300, 66, 12, '#fff', '#000', 3);
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(hx - 14, 278); ctx.lineTo(hx, 298); ctx.lineTo(hx + 10, 278); ctx.fill();
          para(shown, bx + 14, 240, 272, 26, 22, { color: '#111' });
        }
      }
      if (live && f.lt > LIVE_DONE) {
        rrect(180, 408, 600, 126, 10, 'rgba(0,0,0,.9)', C.g, 3);
        T('WELCOME TO THE FLYCAST', W / 2, 438, { size: 16, align: 'center', color: C.g });
        const m = Math.floor(G.runTime / 60), s = Math.floor(G.runTime % 60);
        const rank = G.fails === 0 ? 'FLAWLESS. All hail King Vlog. 👑' : G.fails <= 3 ? 'Solid. Hitch is mildly impressed.' : 'Rough morning. Classic Maniac.';
        T(`Time ${m}:${String(s).padStart(2, '0')}   ·   L's taken: ${G.fails}`, W / 2, 468, { size: 26, font: FB, align: 'center' });
        T(rank, W / 2, 492, { size: 24, font: FB, align: 'center', color: '#b7beb0' });
        if (f.lt > LIVE_DONE + 0.8 && (t * 2 % 1) < 0.6) T('SPACE / TAP TO PLAY AGAIN', W / 2, 520, { size: 10, align: 'center', color: C.white });
      }
    },
  },
};
const BOOKS = [];
for (let j = 0; j < 3; j++) {
  let x = 4;
  while (x < W) {
    const w = randi(10, 20), h = randi(46, 80);
    if (Math.random() < 0.08) { x += randi(30, 60); continue; }
    BOOKS.push({ x, y: 94 + j * 100 - h, w: w - 2, h, c: pick(['#b8432f', '#2c6e9b', '#e0b13b', '#3d7a3a', '#8e5a9b', '#d9d2c0', '#2a2a2a', '#b85c2a', '#557a95', '#c7c0a8']) });
    x += w;
  }
}
const FIN_LINES = [
  ['HITCH', "Bro. You're 40 minutes late. Again."],
  ['MANIAC', 'Dude. You have NO idea what I just went through.'],
  ['HITCH', 'Let me guess. Hungover, almost tweaked your back, DoorDash, Halo 3, and the dating apps?'],
  ['MANIAC', '...how did you know that.'],
  ['HITCH', "Because it's literally every episode."],
  ['HITCH', "Sit down. We're live in 3... 2..."],
];
const LIVE_LINES = [
  ['MANIAC', 'Welllllllcome back to the Flycast!', 0.6],
  ['HITCH', 'Episode who gives a fudge.', 2.4],
];
const LIVE_DONE = 4;
function startFinale() { G.fin = { phase: 'walk', x: -60, i: 0, lt: 0 }; go('finale'); }

/* =====================================================================
   LOOP
   ===================================================================== */
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play') G.paused = true; });
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (ptr.justDown && hit(ptr, MUTE)) { muted = !muted; ptr.justDown = false; }
  if (pressed.has('KeyM')) muted = !muted;
  if (G.scene === 'play' && (pressed.has('KeyP') || pressed.has('Escape'))) { G.paused = !G.paused; pressed.clear(); }
  if (G.paused && G.scene === 'play' && act()) { G.paused = false; pressed.clear(); ptr.justDown = false; }

  if (!G.paused) {
    G.t += dt;
    SCENES[G.scene].update(dt);
    for (const p of pops) { p.t += dt; p.y -= 40 * dt; }
    for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; c.vy += 30 * dt; }
    shakeAmt = Math.max(0, shakeAmt - 50 * dt);
    flashA = Math.max(0, flashA - 1.4 * dt);
  }
  for (let i = pops.length - 1; i >= 0; i--) if (pops[i].t > 1.1) pops.splice(i, 1);
  for (let i = confetti.length - 1; i >= 0; i--) if (confetti[i].y > H + 20) confetti.splice(i, 1);

  // draw
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  rect(0, 0, W, H, C.bg);
  ctx.save();
  if (shakeAmt > 0) ctx.translate(rand(-shakeAmt, shakeAmt) * 0.5, rand(-shakeAmt, shakeAmt) * 0.5);
  SCENES[G.scene].draw();
  ctx.restore();
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
    T(p.s, p.x, p.y, { size: p.size, align: 'center', color: p.c, shadow: '#000', sd: 2 });
  }
  ctx.globalAlpha = 1;
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); rect(-c.w / 2, -c.h / 2, c.w, c.h, c.c); ctx.restore();
  }
  if (flashA > 0) { ctx.globalAlpha = flashA; rect(0, 0, W, H, flashC); ctx.globalAlpha = 1; }
  if (G.paused && G.scene === 'play') {
    rect(0, 0, W, H, 'rgba(0,0,0,.7)');
    T('PAUSED', W / 2, H / 2, { size: 36, align: 'center', color: C.g });
    T('SPACE / TAP TO RESUME', W / 2, H / 2 + 44, { size: 12, align: 'center' });
  }
  drawMute();

  pressed.clear(); ptr.justDown = false; ptr.swipe = 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
